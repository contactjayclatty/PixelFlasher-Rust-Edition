name: Windows validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace -j 2
      - run: cargo clippy --locked --workspace --all-targets -j 2 -- -D warnings
      - run: cargo build --locked --workspace --release -j 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/smoke.py target/release/pixelflasher-rust.exe
      - run: python scripts/mcp_smoke.py target/release/pixelflasher-mcp.exe
