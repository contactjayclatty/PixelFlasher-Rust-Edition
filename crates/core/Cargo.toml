[package]
name="pixelflasher-core"
version="0.3.2"
edition="2024"
license="AGPL-3.0-or-later"
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "1.3"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate", "bzip2"] }
flate2 = "1"
tar = "0.4"
bzip2 = "0.6"
xz2 = "0.1"
prost = "0.14"
rusqlite = { version = "0.38", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
regex = "1"
quick-xml = "0.38"
base64 = "0.22"
x509-parser = { version = "0.18", features = ["verify"] }

zeroize="1"
fs2="0.4"
